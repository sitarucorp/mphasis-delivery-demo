spring.application.name=mphasis-demo-backend
server.port=${PORT:8181}
_DASHBOARD_API_VERSION=v1
spring.r2dbc.url=r2dbc:h2:mem:///delivery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

sql.init.mode=always
sql.init.schema-locations=classpath:schema.sql
sql.init.data-locations=classpath:data.sql

# management
management.endpoint.health.probes.enabled=true
management.endpoint.health.liveness.enabled=true
management.endpoint.health.readiness.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.dashboard.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.auditevents.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.configprops.show-values=always
management.endpoint.env.show-values=always
management.endpoints.web.base-path=/howru

# springdoc openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled = true
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled = false
springdoc.swagger-ui.filter = false
springdoc.swagger-ui.syntaxHighlight.activated = true

logging.level.org.springframework.r2dbc=DEBUG