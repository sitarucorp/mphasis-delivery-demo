server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.mphasis.delivery.dashboard
dashboard.trace.http=true
dashboard.enabled=true
app.backend.url=http://localhost/
# management
management.endpoint.health.probes.enabled=true
management.endpoint.health.liveness.enabled=true
management.endpoint.health.readiness.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.dashboard.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.auditevents.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.configprops.show-values=always
management.endpoint.env.show-values=always
management.endpoints.web.base-path=/howru
