global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'csp-report-app-dashboard'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['cspreport-dashboard:8081', 'cspreport-dashboard:9464']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['collector:9464']
