services:
  cspreport-dashboard:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9464:9464"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_LOG4J_ROOT_LOGLEVEL=WARN
      - KAFKA_LOG4J_TOOLS_LOGLEVEL=ERROR
    #      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
    #      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    #      - OTEL_TRACES_EXPORTER=otlp
    #      - OTEL_METRICS_EXPORTER=prometheus
    #      - OTEL_EXPORTER_PROMETHEUS_PORT=9464
    #      - OTEL_SERVICE_NAME=cspreport-dashboard
    depends_on:
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./devops/kafka/init-kafka.sh:/etc/confluent/docker/init-kafka.sh:ro
    command: [ "/bin/bash", "-c", "/etc/confluent/docker/init-kafka.sh & /etc/confluent/docker/run" ]
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  collector:
    image: otel/opentelemetry-collector-contrib:latest #0.128.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    expose:
      - 4317
    volumes:
      - ./devops/observability/opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

  nginx:
    image: nginx:stable
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - cspreport-dashboard

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./devops/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    command:
        - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - dashboard-storage:/var/lib/grafana
      - ./devops/observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin


volumes:
  dashboard-storage:
