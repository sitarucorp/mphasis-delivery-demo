services:
  collector:
    image: otel/opentelemetry-collector-contrib:latest #0.128.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    expose:
      - 4317
    volumes:
      - ./../../devops/observability/opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "14250:14250"   # Collector gRPC
      - "6831:6831/udp" # Agent UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      -
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./../../devops/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./../../devops/observability/grafana/:/etc/grafana/
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
