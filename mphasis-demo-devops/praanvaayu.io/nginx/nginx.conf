events {}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
        }

        location /anomaly {
            root /usr/share/nginx/html;
            index anomaly.html;
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
        }

	location /backend {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
	    proxy_set_header X-Tenant UHJhYW5WYWF5dQo=
            proxy_set_header X-Real-IP $remote_addr;
        }

	location /praanvaayu {
            proxy_pass http://csp-report-dashboard/;
            proxy_set_header Host $host;
	    proxy_set_header X-Tenant UHJhYW5WYWF5dQo=
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
            proxy_set_header X-Real-IP $remote_addr;
        }

	location /dashboard {
            proxy_pass http://csp-report-dashboard/;
            proxy_set_header Host $host;
	    proxy_set_header X-Tenant UHJhYW5WYWF5dQo=
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /csp-report-dashboard {
            proxy_pass http://csp-report-dashboard/;
            proxy_set_header Host $host;
	    proxy_set_header X-Tenant UHJhYW5WYWF5dQo=
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /csp-report {
            proxy_pass http://csp-report-dashboard/api/csp-report;
            proxy_set_header Host $host;
	    proxy_set_header X-Tenant UHJhYW5WYWF5dQo=
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
